[package]
name = "inmaa-pro"
version = "1.1.0"
description = "Inmaa Pro — cleaning centre management, offline desktop"
authors = ["hamawebdev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inmaa_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset backs the assetProtocol scope in tauri.conf.json, which is how
# uploaded photos and scans get served to <img> from the app data dir.
#
# No opener, http, shell, updater or websocket plugin, on purpose: the program
# is offline, and src/lib/offline.test.ts fails if one of them comes back.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-log = "2.8.0"
tauri-plugin-os = "2.3.2"
thiserror = "2.0.18"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# The application database. `tauri-plugin-sql` is deliberately NOT used: it opens
# a multi-connection sqlx pool and hands an arbitrary connection to each call, so
# a BEGIN issued by one call and the statements after it can land on different
# connections. We own a single connection instead (see src/db.rs), which is what
# makes the transactions the ported server actions rely on actually atomic.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "json",
  "migrate",
  "macros",
] }

# The chain anchor's seal (HMAC-SHA256, src/anchor.rs) and the SHA-256 of a
# backup or a received file. Both were already in the tree through sqlx and
# tauri.
sha2 = "0.10"
hmac = "0.12"

# Two-laptop sync (docs/sync/DECISION.md section 9): the one HTTP client, used
# in src/sync/http.rs only, toward the one mailbox address the director typed,
# over HTTPS. ureq because it is small and blocking (no second async runtime),
# and because its rustls runs on `ring` with the webpki root certificates built
# in: no OpenSSL and no aws-lc to build on Windows, no system trust store to
# depend on. No gzip, no cookies, no proxy discovery beyond ureq's defaults.
# src/lib/offline.test.ts allows this crate, and only in that file.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-window-state = "2.4.1"
